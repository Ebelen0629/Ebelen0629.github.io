<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games | EatEasy</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .game-container { 
            margin: 3rem 0; 
            padding: 2rem; 
            background: white; 
            border-radius: 16px; 
            box-shadow: 0 6px 20px rgba(0,0,0,0.1); 
        }

        .reaction-box {
            width: 100%;
            height: 280px;
            background: #f8f1e9;
            border: 3px solid #e65100;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            margin: 1.5rem 0;
            transition: all 0.2s;
        }
    </style>
</head>
<body>

<header>
    <nav>
        <div class="logo">EatEasy</div>
        <button class="menu-toggle" id="menu-toggle">☰</button>
        <div class="nav-links" id="nav-menu">
            <a href="Final.html">Home</a>
            <a href="quiz.html">Quiz</a>
            <a href="games.html">Games</a>
            <a href="random.html">Random Meal</a>
            <a href="recipes.html">Recipes</a>
            <a href="about.html">About</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<main id="main-content">
    <div class="container" style="max-width: 1100px; margin: 2rem auto;">

        <h1 style="text-align:center; margin-bottom: 3rem;">EatEasy Games - The Winner Decides the Meal!</h1>

        <div class="game-container">
            <h2 style="text-align:center;">Tic Tac Toe</h2>
            <div id="ttt-board" style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 420px; margin: 20px auto;"></div>
            <div style="text-align:center;">
                <button id="ttt-reset" class="btn btn-orange">New Game</button>
                <h3 id="ttt-status" style="margin-top: 1rem; font-size: 1.35rem; font-weight: bold;"></h3>
            </div>
        </div>

        <hr style="margin: 4rem 0;">

        <div class="game-container">
            <h2 style="text-align:center;">Green Light Reaction</h2>
            <p style="text-align:center; margin-bottom: 1rem;">Click as fast as you can when it turns <strong style="color:#2ecc71;">GREEN</strong>!</p>
            
            <div id="reaction-box" class="reaction-box" style="background:#e74c3c; color:white;">
                Wait for Green...
            </div>

            <div style="text-align:center;">
                <button id="start-reaction" class="btn btn-orange">Start Game</button>
                <h3 id="reaction-result" style="margin-top: 1.5rem; font-size: 1.4rem; font-weight: bold; min-height: 50px;"></h3>
            </div>
        </div>

    </div>
</main>

<footer>
    <p>&copy; 2026 EatEasy - Solving Food Indecision</p>
</footer>

<script>
// TIC TAC TOE GAME
let tttState = Array(9).fill('');
let tttPlayer = 'X';
let tttActive = true;
const tttBoard = document.getElementById('ttt-board');
const tttStatus = document.getElementById('ttt-status');

function createTTT() {
    tttBoard.innerHTML = '';
    tttState.forEach((_, i) => {
        const cell = document.createElement('div');
        cell.style.cssText = 
        `height: 130px; 
        background:white; 
        border-radius:12px; 
        display:flex; 
        align-items:center; 
        justify-content:center; 
        font-size:3.8rem; 
        font-weight:bold; 
        cursor:pointer; 
        box-shadow:0 4px 15px rgba(0,0,0,0.1);`;

        cell.dataset.index = i;
        cell.addEventListener('click', () => tttClick(i));
        tttBoard.appendChild(cell);
    });
}

function tttClick(i) {
    if (tttState[i] || !tttActive) return;
    tttState[i] = tttPlayer;
    tttBoard.children[i].textContent = tttPlayer;

    if (checkWin(tttState, tttPlayer)) {
        tttStatus.textContent = `🎉 Player ${tttPlayer} Wins!`;
        tttActive = false;
        return;
    }
    if (!tttState.includes('')) {
        tttStatus.textContent = "It's a Draw!";
        tttActive = false;
        return;
    }
    tttPlayer = tttPlayer === 'X' ? 'O' : 'X';
    tttStatus.textContent = `Player ${tttPlayer}'s Turn`;
}

function checkWin(state, player) {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    return wins.some(combo => combo.every(idx => state[idx] === player));
}

document.getElementById('ttt-reset').addEventListener('click', () => {
    tttState = Array(9).fill('');
    tttPlayer = 'X';
    tttActive = true;
    tttStatus.textContent = `Player X's Turn`;
    createTTT();
});

// REACTION TIME GAME
let reactionTimeout;
let startTime;
const reactionBox = document.getElementById('reaction-box');
const reactionResult = document.getElementById('reaction-result');
const startBtn = document.getElementById('start-reaction');

function startReactionGame() {
    startBtn.disabled = true;
    reactionResult.textContent = "";
    reactionBox.style.background = "#e74c3c";
    reactionBox.textContent = "Wait for Green...";

    const delay = Math.random() * 3000 + 1500; // 1.5 to 4.5 seconds

    reactionTimeout = setTimeout(() => {
        reactionBox.style.background = "#2ecc71";
        reactionBox.textContent = "CLICK NOW!";
        startTime = Date.now();
    }, delay);
}

reactionBox.addEventListener('click', () => {
    if (reactionBox.style.backgroundColor === "rgb(46, 204, 113)") { // green
        const reactionTime = Date.now() - startTime;
        reactionResult.textContent = `🎯 Your reaction time: ${reactionTime} ms`;
        reactionBox.style.background = "#e74c3c";
        reactionBox.textContent = "Well done!";
        startBtn.disabled = false;
    } else if (reactionBox.textContent === "Wait for Green...") {
        clearTimeout(reactionTimeout);
        reactionResult.textContent = "⛔ Too early! Wait for green.";
        reactionBox.style.background = "#e74c3c";
        startBtn.disabled = false;
    }
});

startBtn.addEventListener('click', startReactionGame);

// Mobile Menu
document.getElementById("menu-toggle").addEventListener("click", () => {
    document.getElementById("nav-menu").classList.toggle("active");
});

// Initialize
createTTT();
tttStatus.textContent = `Player X's Turn`;
</script>

</body>
</html>
